version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: carbon-guard-backend
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=Carbon Guard
      - APP_VERSION=1.0.0
      - DEBUG=false
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=sqlite:///./carbon_guard.db
      - CORS_ORIGINS=["http://localhost","http://localhost:80","http://localhost:5173"]
      - DEFAULT_CARBON_INTENSITY=475
      - DEFAULT_RENEWABLE_PERCENTAGE=25
      - DEFAULT_ENERGY_CONSUMPTION_KWH=0.5
      - MINIMUM_SAVINGS_THRESHOLD=0.01
      - MAX_DELAY_HOURS=4
    volumes:
      - backend-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: carbon-guard-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend-data:
